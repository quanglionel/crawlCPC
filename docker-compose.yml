services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-crawler:latest
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      GROQ_MAX_ARTICLE_CHARS: ${GROQ_MAX_ARTICLE_CHARS:-8000}
      GROQ_MAX_OUTPUT_TOKENS: ${GROQ_MAX_OUTPUT_TOKENS:-900}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
  crawler:
    image: media-crawler:latest
    working_dir: /app
    volumes:
      - ./:/app
    command:
      [
        "python",
        "-m",
        "app.main",
        "crawl",
        "--config",
        "configs/vnexpress_kinh_doanh.json",
        "--output",
        "output/articles.json",
        "--max-pages",
        "1",
        "--max-articles",
        "5"
      ]
    profiles: ["cli"]

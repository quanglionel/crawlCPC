services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-crawler:latest
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8001:8001"
    command: ["web", "--host", "0.0.0.0", "--port", "8001"]
  crawler:
    image: media-crawler:latest
    working_dir: /app
    volumes:
      - ./:/app
    command:
      [
        "crawl",
        "--config",
        "configs/vnexpress_kinh_doanh.json",
        "--output",
        "output/articles.json",
        "--max-pages",
        "1",
        "--max-articles",
        "5"
      ]
    profiles: ["cli"]
